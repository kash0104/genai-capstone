[project]
name = "genai-capstone"
version = "0.1.0"
description = "Learning LLMs, RAG and agents by building one engine with two tracks."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/capstone"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["ollama: needs a running local Ollama server"]
addopts = "-m 'not ollama'"
